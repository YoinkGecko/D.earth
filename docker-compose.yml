services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: darukaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa_password
      POSTGRES_DB: darukaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
